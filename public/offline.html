<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PlusOpinion — You're Offline</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020205">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:    #020205;
      --card:  rgba(255,255,255,0.04);
      --neon:  #2f8bff;
      --muted: rgba(255,255,255,0.55);
      --border: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }

    /* Ambient background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, #2f8bff, transparent);
      top: -80px; left: -80px;
    }
    .orb-2 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #6fb6ff, transparent);
      bottom: -60px; right: -60px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: rise 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Wifi icon */
    .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(47,139,255,0.12);
      border: 1px solid rgba(47,139,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(47,139,255,0.3); }
      50%       { box-shadow: 0 0 0 18px rgba(47,139,255,0); }
    }

    .icon-wrap svg {
      width: 36px; height: 36px;
      stroke: #2f8bff;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--neon);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.96); opacity: 0.9; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff6b6b;
      animation: blink 1.5s ease-in-out infinite;
    }

    .dot.online { background: #6bffb6; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo">PlusOpinion</div>

    <div class="icon-wrap">
      <!-- Wifi off icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="#2f8bff" stroke="none"/>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Your cached content is still available once you reconnect.</p>

    <button class="btn" onclick="tryReconnect()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
      </svg>
      Try again
    </button>

    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">No internet connection</span>
    </div>
  </div>

  <script>
    function tryReconnect() {
      window.location.reload();
    }

    // Monitor connection status
    function updateStatus() {
      const dot  = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Back online — reloading…';
        setTimeout(() => window.location.replace('/feed'), 1200);
      } else {
        dot.classList.remove('online');
        text.textContent = 'No internet connection';
      }
    }

    window.addEventListener('online',  updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
