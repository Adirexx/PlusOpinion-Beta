<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Global Design System -->
    <link rel="stylesheet" href="/global.css">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020205">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PlusOpinion",
      "alternateName": "PlusOpinion",
      "url": "https://plusopinion.com/"
    }
    </script>

    <!-- Favicon for browser tabs -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png">

    <!-- Supabase UMD bundle (must load before supabase.js) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script type="module" src="/supabase.js"></script>
    <script type="module" src="/auth.js"></script>

    <!-- SPA Core Infrastructure -->
    <script type="module" src="/state_manager.js"></script>
    <script type="module" src="/router.js"></script>
    <script type="module" src="/pull_to_refresh.js"></script>
    <script type="module" src="/navigation_preloader.js"></script>

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/runtime.js"></script>
    <script type="module" src="/api.js"></script>
    <script type="module" src="/notifications.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Professional Update & Maintenance System -->
    <script src="/updater.js"></script>

    <!-- Visual Tokens & Global CSS -->
    <style>
        :root {
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-heading: 'Space Grotesk', system-ui, serif;

            --bg-deep: #020205;
            --neon: #2f8bff;
            --neon-weak: rgba(47, 139, 255, 0.18);
            --muted: rgba(255, 255, 255, 0.65);
            --card: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-green: #6BFFB6;
            --accent-gold: #FFD700;

            --radius: 16px;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: white;
            font-family: var(--font-body);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- AMBIENT BACKGROUND --- */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 0% 0%, rgba(47, 139, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 0%, #0a0e1c 0%, var(--bg-deep) 80%);
            z-index: -2;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .orb { display: none; }

        .orb-1 { display: none; }

        .orb-2 { display: none; }

        @keyframes breathe {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }

            100% {
                transform: scale(1.1);
                opacity: 0.5;
            }
        }

        /* --- APP CONTAINER --- */
        #root {
            width: 100%;
            height: 100%;
            max-width: 450px;
            background-color: rgba(3, 4, 18, 0.85); 
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        /* --- UTILITIES --- */
        .smooth-scroll-container {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .font-heading {
            font-family: var(--font-heading);
        }

        .glass-panel {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }

        .header-glass {
            background: rgba(3, 4, 18, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .rqs-pill {
            background: linear-gradient(90deg, var(--neon), #6fb6ff);
            box-shadow: 0 0 12px var(--neon-weak);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Profile Specifics */
        .profile-avatar-container {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        .banner-gradient {
            background: linear-gradient(135deg, #1a1f35 0%, #0d101b 100%);
            position: relative;
            overflow: hidden;
        }

        .banner-gradient::after {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1000&auto=format&fit=crop') center/cover;
            opacity: 0.2;
            mix-blend-mode: overlay;
        }

        /* OPINION BUTTON ANIMATION (RESTORED) */
        .opinion-btn {
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .opinion-icon {
            transition: transform 0.5s ease;
        }

        .opinion-btn:active .opinion-icon,
        .opinion-btn:hover .opinion-icon {
            transform: rotate(90deg);
        }

        .opinion-btn:active,
        .opinion-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(47, 139, 255, 0.8);
        }

        /* Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-enter {
            animation: slideInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }

        .touch-scale:active {
            transform: scale(0.96);
            opacity: 0.8;
            transition: all 0.1s;
        }

        /* Tooltips */
        .delayed-label {
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            transition-delay: 0s;
            pointer-events: none;
            z-index: 100;
        }

        .group:active .delayed-label,
        .group:hover .delayed-label {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 1s;
        }

        /* MySpace Swoosh */
        .myspace-swoosh {
            opacity: 0.7;
            transform: translateX(-5px) translateY(5px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .myspace-trigger:hover .myspace-swoosh {
            opacity: 1;
            transform: translateX(0) translateY(0);
            stroke: var(--neon);
        }

        /* Image Magnify for Post */
        .img-magnify-wrapper {
            overflow: hidden;
        }

        .img-magnify {
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .group:hover .img-magnify,
        .group:active .img-magnify {
            transform: scale(1.08);
        }

        .nav-glass {
            background: rgba(3, 4, 18, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        /* Hide Scrollbar but allow scroll */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: 'var(--neon)',
                        muted: 'var(--muted)',
                        'accent-green': 'var(--accent-green)',
                        'accent-gold': 'var(--accent-gold)',
                    },
                    fontFamily: {
                        heading: ['Space Grotesk', 'serif'],
                    }
                }
            }
        }
    </script>
</head>

</html>
