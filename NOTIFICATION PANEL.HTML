<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusOpinion Notifications</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Global Design System -->
    <link rel="stylesheet" href="/global.css">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020205">

    <!-- Favicon for browser tabs -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png">

    <!-- Supabase UMD bundle (must load before supabase.js) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="/supabase.js?v=2.0"></script>
    <script src="/auth.js?v=2.0"></script>

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/runtime.js?v=2.0"></script>
    <script src="/api.js?v=3.0"></script>
    <script src="/notifications.js?v=2.0"></script>

    <!-- SPA Core Infrastructure -->
    <script src="/state_manager.js"></script>
    <script src="/router.js"></script>
    <script src="/spa_router.js"></script>
    <script src="/pull_to_refresh.js"></script>
    <script src="/navigation_preloader.js"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Professional Update & Maintenance System -->
    <script src="/updater.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Visual Tokens & Global CSS -->
    <style>
        :root {
            --bg-deep: #020205;
            --neon: #2f8bff;
            --muted: rgba(255, 255, 255, 0.6);
            --card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --danger: #FF5252;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND --- */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 0% 0%, rgba(47, 139, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 0%, #0a0e1c 0%, var(--bg-deep) 80%);
            z-index: -2;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .orb { display: none; }

        .orb-1 { display: none; }

        .orb-2 { display: none; }

        @keyframes breathe {
            0% {
                opacity: 0.4;
            }

            100% {
                opacity: 0.6;
            }
        }

        /* --- APP CONTAINER --- */
        #root {
            width: 100%;
            height: 100%;
            max-width: 450px;
            background-color: rgba(3, 4, 18, 0.85); 
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        .font-heading {
            font-family: 'Space Grotesk', serif;
        }

        .nav-glass {
            background: rgba(3, 4, 18, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        .header-glass {
            background: rgba(3, 4, 18, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Toast */
        .toast {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e24;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 100;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 360px;
        }

        .toast-msg {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 500;
        }

        .toast-action {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon);
            letter-spacing: 0.5px;
        }

        /* Highlighting Animation */
        @keyframes flash-highlight {
            0% {
                background-color: transparent !important;
            }

            10% {
                background-color: rgba(47, 139, 255, 0.45) !important;
            }

            100% {
                background-color: transparent !important;
            }
        }

        .highlight-flash {
            animation: flash-highlight 2.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            position: relative;
            z-index: 20;
        }

        .highlight-flash::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid var(--neon) !important;
            box-shadow: 0 0 20px rgba(47, 139, 255, 0.4);
            opacity: 0.8;
            pointer-events: none;
            border-radius: inherit;
            z-index: 25;
        }

        /* Settings/Filter Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 60;
            display: flex;
            align-items: flex-end;
            /* Bottom sheet style */
        }

        .modal-content {
            background: #0A0F1D;
            border-top: 1px solid var(--glass-border);
            border-radius: 24px 24px 0 0;
            width: 100%;
            padding: 24px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }
    </style>


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: 'var(--neon)',
                        muted: 'var(--muted)',
                        danger: 'var(--danger)',
                    },
                    fontFamily: { heading: ['Space Grotesk', 'serif'] }
                }
            }
        }
    </script>

</head>

<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div id="root"></div>

    <script src="/NOTIFICATION PANEL.compiled.js"></script>

    <!-- ===================================================== -->
    <!-- INBOX PANEL — Loaded after React mounts                -->
    <!-- inbox.js: CSS + HTML shell + gesture engine            -->
    <!-- inbox_panel.js: data layer, rendering, realtime        -->
    <!-- ===================================================== -->
    
    
    

    <!-- Crypto, Realtime, Profile Integration -->
    <script src="inbox_crypto.js"></script>
    <script src="inbox.js"></script>
    <script src="inbox_panel.js"></script>
</body>


</html>
